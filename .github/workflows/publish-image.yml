name: Publish GHCR image

on:
  push:
    branches: [main]
    tags: ['v*']
    # The gateway agent is released separately (release-agent.yml).
    paths-ignore: ['agent/**', '.github/workflows/release-agent.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # A commit is published only after its type checks and tests pass.
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: traffic
          POSTGRES_USER: traffic
          POSTGRES_PASSWORD: traffic
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U traffic -d traffic"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://traffic:traffic@localhost:5432/traffic
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm test
      - name: Database integration tests
        run: |
          pnpm db:migrate
          DB_INTEGRATION=1 pnpm --filter @utm/collector test

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tags=$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'tags<<EOF'
              echo "$image:latest"
              echo "$image:sha-${GITHUB_SHA}"
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
